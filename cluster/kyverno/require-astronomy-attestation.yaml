# SLSA (Aug 2026 — ImageValidatingPolicy, the current Kyverno type; legacy
# ClusterPolicy verifyImages is deprecated and removed in v1.20).
# Requires every ghcr.io/toreau/astronomy-api image admitted in this cluster to
# carry a SigstoreBundle SLSA-provenance attestation signed by the shared
# container-merge-attest reusable workflow (keyless, public-good Sigstore).
# Note: since attestation creation moved into the reusable workflow
# (toreau/gh-workflows), the build signer (certificate SAN) is that workflow,
# not astronomy's ci.yml — the subject below matches the signer.
# Registry auth for the private GHCR package comes from
# `credentials.secrets` (read from the kyverno namespace; secret created
# outside git:
#   kubectl -n kyverno create secret docker-registry regcred \
#     --docker-server=ghcr.io --docker-username=toreau --docker-password=<read:packages token>
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-astronomy-attestation
spec:
  validationActions: [Deny]
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        resources: ['pods']
        operations: ['CREATE', 'UPDATE']
  matchImageReferences:
    - glob: 'ghcr.io/toreau/astronomy-api*'
  credentials:
    allowInsecureRegistry: false
    secrets:
      - regcred
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subject: 'https://github.com/toreau/gh-workflows/.github/workflows/container-merge-attest.yml@refs/tags/v1'
              issuer: 'https://token.actions.githubusercontent.com'
        ctlog:
          url: 'https://rekor.sigstore.dev'
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  validations:
    - expression: >-
        images.containers.map(image,
          verifyAttestationSignatures(image, attestations.provenance, [attestors.cosign])
        ).all(e, e > 0)
      message: 'image must carry a valid SLSA provenance attestation from the container-merge-attest workflow'
