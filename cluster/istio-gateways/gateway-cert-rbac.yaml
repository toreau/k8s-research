apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-cert-reader
  namespace: sample
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-cert-reader
  namespace: sample
subjects:
  - kind: ServiceAccount
    name: istio-ingress-external-service-account
    namespace: istio-gateways
roleRef:
  kind: Role
  name: gateway-cert-reader
  apiGroup: rbac.authorization.k8s.io
