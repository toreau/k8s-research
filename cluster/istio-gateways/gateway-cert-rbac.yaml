apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-cert-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-cert-reader
subjects:
  - kind: ServiceAccount
    name: istio-ingress-external-service-account
    namespace: istio-gateways
roleRef:
  kind: ClusterRole
  name: gateway-cert-reader
  apiGroup: rbac.authorization.k8s.io
