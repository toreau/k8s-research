# GitHub artifact-attestations trust-policies chart values
# (oci://ghcr.io/github/artifact-attestations-helm-charts/trust-policies, v0.7.0).
# Enforces SLSA-provenance attestations on the images in `policy.images` (the
# reference app, frosta-historielag.no), in namespaces labeled
# policy.sigstore.dev/include=true. Admission signer identity is restricted to
# the trusted central reusable container-build-attest workflow; the allowed
# signer revisions correspond to the canonical promotion trust set in
# ci/trusted-builders.yaml (consistency enforced by ci/scripts/admission-trust.rb).
# `policy.images` is an explicit image allowlist; the exempt policy covers the
# istio init/proxy images (registry.istio.io proxyv2) used in pods.
# `trust.github` + `trust.sigstorePublic` stay true (default): the GitHub
# trust-root authority does not yet verify our rekor-logged bundles, so the
# public-good authority does the actual enforcement (S1 finding).
policy:
  enabled: true
  subjectRegExp: '^https://github[.]com/toreau/gh-workflows/[.]github/workflows/container-build-attest[.]yml@373df7517487bd20ac55a0986926677c0ddcbcf6$'
  images:
    - "ghcr.io/toreau/frosta-historielag.no**"
  exemptImages:
    - "registry.istio.io/release/proxyv2**"
