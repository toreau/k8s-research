# GitHub artifact-attestations trust-policies chart values
# (oci://ghcr.io/github/artifact-attestations-helm-charts/trust-policies, v0.7.0).
# Enforces SLSA-provenance attestations on the images in `policy.images` (the
# reference app, frosta-historielag.no), in namespaces labeled
# policy.sigstore.dev/include=true. Signer validation is ORGANIZATION-based
# (organization: toreau, repository: '.*'): any workflow in the toreau org
# (a personal account — i.e. our own repos) may sign. Per-app provenance still
# exists in the attestation SAN: each app attests inline in its own ci.yml, so
# the subject carries <repo>/.github/workflows/ci.yml@refs/heads/main.
# `policy.images` is an explicit allowlist; the exempt policy covers the istio
# init/proxy images (registry.istio.io proxyv2) used in pods.
# `trust.github` + `trust.sigstorePublic` stay true (default): the GitHub
# trust-root authority does not yet verify our rekor-logged bundles, so the
# public-good authority does the actual enforcement (S1 finding).
policy:
  enabled: true
  organization: toreau
  repository: '.*'
  images:
    - "ghcr.io/toreau/frosta-historielag.no**"
  exemptImages:
    - "registry.istio.io/release/proxyv2**"
