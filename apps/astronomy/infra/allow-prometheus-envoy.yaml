# Astronomy's observability onboarding: allow Prometheus (monitoring ns) to scrape
# envoy sidecar stats on 15090 in this default-denied app namespace (the Skiperator
# ingress NetPols only admit mesh). Any istio-injected app namespace needs this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-envoy
  namespace: astronomy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 15090
