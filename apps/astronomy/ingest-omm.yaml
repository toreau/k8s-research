apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-omm
  namespace: astronomy
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ingest
          image: astronomy-api:local
          imagePullPolicy: Never
          command: ["dotnet", "Astronomy.DataIngestion.dll", "omm", "refresh"]
          envFrom:
            - secretRef:
                name: astronomy-db-creds
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: astronomy-data
