apiVersion: apps/v1
kind: Deployment
metadata:
  name: astronomy-db
  namespace: astronomy-db
  labels:
    app: astronomy-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astronomy-db
  template:
    metadata:
      labels:
        app: astronomy-db
    spec:
      # Official postgres image entrypoint runs as root and drops to uid 999 (postgres)
      # internally via gosu. Forcing runAsUser here breaks its chmod/chown on the data dir.
      # fsGroup keeps the PVC group-writable for the postgres process.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: astronomy-db-creds
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: astronomy-db-data
