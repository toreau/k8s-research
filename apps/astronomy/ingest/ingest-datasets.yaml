apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-datasets
  namespace: astronomy
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: github-auth
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ingest
          image: ghcr.io/toreau/astronomy-api@sha256:4af71f7759e025ce0bb2f1ba300823795fcdf8fd7edc287be0f8f92404e5dc16
          command:
            - /bin/sh
            - -c
            - >-
              dotnet Astronomy.DataIngestion.dll ingest eop &&
              dotnet Astronomy.DataIngestion.dll ingest eop-c04 &&
              dotnet Astronomy.DataIngestion.dll ingest leap-seconds &&
              dotnet Astronomy.DataIngestion.dll ingest star-catalog &&
              dotnet Astronomy.DataIngestion.dll dataset status
          envFrom:
            - secretRef:
                name: astronomy-db-creds
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: astronomy-data
