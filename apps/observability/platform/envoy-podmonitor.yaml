apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-sidecars
  namespace: monitoring
  labels:
    app.kubernetes.io/name: observability
spec:
  selector:
    matchExpressions:
      - key: service.istio.io/canonical-name
        operator: Exists
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: 30s
      relabelings:
        # istio injects the proxy as a (native sidecar) init container — the
        # operator emits one target per container, all mapping to the pod IP.
        # Keep only the istio-proxy container to avoid 3x duplicate scrapes.
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          action: keep
          regex: istio-proxy
        - sourceLabels: [__meta_kubernetes_pod_ip]
          action: replace
          targetLabel: __address__
          replacement: "${1}:15090"
