apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-sidecars
  namespace: monitoring
  labels:
    app.kubernetes.io/name: observability
spec:
  selector:
    matchExpressions:
      - key: service.istio.io/canonical-name
        operator: Exists
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - targetPort: 15020
      path: /stats/prometheus
      interval: 30s
