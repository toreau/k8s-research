apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-naif
  namespace: astronomy
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: github-auth
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ingest
          image: ghcr.io/toreau/astronomy-api@sha256:2752508a052a096ca85c59726f2767cb82f45199b7a4fb9dc942f50eeda86d17
          command:
            - /bin/sh
            - -c
            - dotnet Astronomy.DataIngestion.dll naif; exit 0
          envFrom:
            - secretRef:
                name: astronomy-db-creds
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: astronomy-data
