apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/toreau/k8s-research.git
    targetRevision: HEAD
    path: apps/observability/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
