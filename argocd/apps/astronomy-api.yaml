apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astronomy-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://host.docker.internal:9418/k8s-research
    targetRevision: HEAD
    path: apps/astronomy-api
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
