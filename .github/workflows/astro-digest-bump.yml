name: astro-digest-bump

on:
  repository_dispatch:
    types: [astro-image-pushed]

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    uses: toreau/gh-workflows/.github/workflows/attestation-gate.yml@e65a28dc2f66faac72ef246eb7685f5a62e51950
    with:
      owner-repo: "toreau/astronomy.aursand.no"
      digest: ${{ github.event.client_payload.digest }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  bump:
    needs: gate
    uses: toreau/gh-workflows/.github/workflows/digest-bump.yml@e65a28dc2f66faac72ef246eb7685f5a62e51950
    with:
      file-path: "apps/astronomy/api.yaml"
      image-prefix: "image: ghcr.io/toreau/astronomy-api@sha256:"
      digest: ${{ github.event.client_payload.digest }}
      sha: ${{ github.event.client_payload.sha }}
      commit-message: "astronomy: bump api digest to {digest12} (sha {sha7})"
      open-pr: true
      head-branch: "bump/astronomy-api-{sha7}"
      pr-title: "astronomy: bump api digest to {digest12} (sha {sha7})"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
