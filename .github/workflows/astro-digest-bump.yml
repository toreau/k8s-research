name: astro-digest-bump

on:
  repository_dispatch:
    types: [astro-image-pushed]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify attestation (gate)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ github.event.client_payload.digest }}
        run: |
          # GitHub-hosted attestations on the subject digest (public repo, no
          # GHCR auth needed). SLSA provenance already binds digest -> build.
          # Registry-side (cosign) enforcement lives in-cluster (Kyverno).
          gh attestation verify "oci://ghcr.io/toreau/astronomy-api@${DIGEST}" \
            -R toreau/astronomy.aursand.no --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://ghcr.io/toreau/astronomy-api@${DIGEST}" \
            -R toreau/astronomy.aursand.no --predicate-type https://spdx.dev/Document/v2.3
          echo "attestations verified for ${DIGEST}"
      - name: Bump api.yaml digest
        id: update
        env:
          DIGEST: ${{ github.event.client_payload.digest }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          # imagetools inspect returns "sha256:<hex>"; strip the prefix so the
          # replacement doesn't duplicate it (the image line already has sha256:).
          d="${DIGEST#sha256:}"
          f=apps/astronomy/api.yaml
          sed -i -E "s#(image: ghcr.io/toreau/astronomy-api@sha256:)[0-9a-f]{64}#\1${d}#" "$f"
          if git diff --quiet "$f"; then
            echo "digest unchanged, nothing to commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new image line: $(grep 'image:' "$f" | head -1)"
          fi
      - name: Commit + push
        if: steps.update.outputs.changed == 'true'
        env:
          DIGEST: ${{ github.event.client_payload.digest }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          git config user.name "k8s-research bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/astronomy/api.yaml
          git commit -m "astronomy: bump api digest to ${DIGEST:0:12} (sha ${SHA:0:7})"
          git push
