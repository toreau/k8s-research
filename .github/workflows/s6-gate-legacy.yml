# S6.1 evidence (temporary): legacy compatibility through the REAL S6 gate.
# Pre-S6 invocation shape: no trusted-signer-digests-json, require-signer-digest
# false, no deny-self-hosted-runners, path-only strong signer + source-ref +
# source-digest. Expected: same authorization as before S6 (success).
# Compatibility evidence only, NOT evidence for the future strong policy.
name: s6-gate-legacy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: toreau/gh-workflows/.github/workflows/attestation-gate.yml@d31696bf041c1462f2b5fd6fcf9b557b6b1e7894
    with:
      owner-repo: toreau/frosta-historielag.no
      digest: sha256:785a25108d229e91a6d84bdb82b5ba6eb951fd509cf5bd4a8b464753b393fe51
      image: ghcr.io/toreau/frosta-historielag.no
      signer-workflow: toreau/gh-workflows/.github/workflows/container-build-attest.yml
      source-ref: refs/heads/main
      source-digest: ab0e7297ce1b7ca56526f7c98de2e7cd31e60cc1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      registry-token: ${{ secrets.GHCR_TOKEN }}
