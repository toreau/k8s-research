name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-apps:
    uses: toreau/gh-workflows/.github/workflows/manifest-validate.yml@v1
    with:
      paths: "apps/"
      schemas-dir: "ci/schemas"
      exclude: 'apps/.*/meta\.yaml$'

  validate-argocd:
    uses: toreau/gh-workflows/.github/workflows/manifest-validate.yml@v1
    with:
      paths: "argocd/apps"
      yamllint-paths: "argocd/"

  resolve-digest:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.extract.outputs.digests }}
      attested: ${{ steps.extract.outputs.attested }}
      damped: ${{ steps.extract.outputs.damped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Extract + verify image digests per app
        id: extract
        run: |
          digests='{}'
          attested='[]'
          damped='[]'
          for meta in apps/*/meta.yaml; do
            [ -f "$meta" ] || continue
            name=$(ruby -ryaml -e "puts YAML.load_file('$meta')['app']['name']")
            image=$(ruby -ryaml -e "puts YAML.load_file('$meta')['app']['image']")
            repo=$(ruby -ryaml -e "puts YAML.load_file('$meta')['app']['repo']")
            attestation=$(ruby -ryaml -e "puts (YAML.load_file('$meta')['app']['attestation'] || false).to_s")
            files=$(ruby -ryaml -e "puts YAML.load_file('$meta')['app']['digestFiles'].join(' ')")
            prefix="image: $image@sha256:"
            digest=""
            for f in $files; do
              line="$(grep "$prefix" "$f" | head -1)"
              [ -n "$line" ] || { echo "::error::$name: no image line ($prefix) in $f"; exit 1; }
              d="${line##*sha256:}"
              [ -n "$d" ] || { echo "::error::$name: could not parse digest from: $line"; exit 1; }
              if [ -z "$digest" ]; then digest="sha256:$d"
              elif [ "sha256:$d" != "$digest" ]; then
                echo "::error::$name: image digests differ ($f=$d vs $digest)"; exit 1
              fi
            done
            digests=$(echo "$digests" | jq -c --arg a "$name" --arg d "$digest" '. + {($a): $d}')
            if [ "$attestation" = "true" ]; then
              attested=$(echo "$attested" | jq -c --arg a "$name" --arg d "$digest" --arg r "$repo" --arg i "$image" '. + [{app:$a,digest:$d,repo:$r,image:$i}]')
            else
              # Damped apps: image->digest binding at the PR boundary (no provenance).
              # Identity comes from trusted meta.yaml + the PR's actual manifest state,
              # never from attacker-controlled PR text.
              damped=$(echo "$damped" | jq -c --arg a "$name" --arg d "$digest" --arg i "$image" '. + [{app:$a,digest:$d,image:$i}]')
            fi
          done
          echo "digests=$digests" >> "$GITHUB_OUTPUT"
          echo "attested=$attested" >> "$GITHUB_OUTPUT"
          echo "damped=$damped" >> "$GITHUB_OUTPUT"

  gate-pr:
    needs: resolve-digest
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Gate attested app digests (strong consumer-side verification)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REG_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ATTESTED: ${{ needs.resolve-digest.outputs.attested }}
        run: |
          n=$(echo "$ATTESTED" | jq 'length')
          echo "attested apps: $n"
          if [ -n "$REG_TOKEN" ]; then
            echo "$REG_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          fi
          while read -r entry; do
            app=$(echo "$entry" | jq -r .app)
            digest=$(echo "$entry" | jq -r .digest)
            repo=$(echo "$entry" | jq -r .repo)
            image=$(echo "$entry" | jq -r .image)
            echo "gate-pr: verifying $app $image@$digest"
            # Strong mode: cryptographic verification of the OCI attestation bundle,
            # bound to the expected repo + signer workflow + source ref.
            # NOTE: no --source-digest here — a direct PR has no independently trusted
            # expected source SHA. This is "trusted-main provenance" (an older but
            # valid main artifact may be promoted, enabling rollback).
            # signer-repo and signer-workflow are mutually exclusive; the workflow
            # path carries the repo identity.
            gh attestation verify "oci://${image}@${digest}" \
              --repo "$repo" \
              --bundle-from-oci \
              --signer-workflow "${repo}/.github/workflows/ci.yml" \
              --source-ref "refs/heads/main" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              || { echo "::error::$app: attestation verification failed for ${image}@${digest}"; exit 1; }
            echo "$app: strong verification OK (trusted-main provenance)"
          done < <(echo "$ATTESTED" | jq -c '.[]')
      - name: Gate damped app digests (OCI image->digest binding)
        env:
          REG_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DAMPED: ${{ needs.resolve-digest.outputs.damped }}
        run: |
          n=$(echo "$DAMPED" | jq 'length')
          echo "damped apps: $n"
          if [ "$n" -eq 0 ]; then echo "no damped apps to gate"; exit 0; fi
          if [ -n "$REG_TOKEN" ]; then
            echo "$REG_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          fi
          while read -r entry; do
            app=$(echo "$entry" | jq -r .app)
            digest=$(echo "$entry" | jq -r .digest)
            image=$(echo "$entry" | jq -r .image)
            echo "gate-pr: binding $app $image@$digest"
            # Damped apps: registry-native verification that the exact digest exists
            # under the expected image (OCI repository). Identity comes from trusted
            # meta.yaml + the PR's actual manifest state, never PR text.
            docker buildx imagetools inspect "${image}@${digest}" >/dev/null 2>&1 \
              || { echo "::error::$app: digest ${digest} not found under expected image ${image}"; exit 1; }
            echo "$app: damped image->digest binding OK"
          done < <(echo "$DAMPED" | jq -c '.[]')
